<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정 - MyCMS</title>
</head>
<body>

<h1>게시글 수정</h1>

<form th:action="@{/admin/posts/{id}(id=${post.id})}" method="post">

    <div>
        <label for="title">제목</label>

        <input type="text"
               id="title"
               name="title"
               th:value="${post.title}">
    </div>
    <div>
        <label for="content">내용</label>

        <textarea id="content"
                  name="content"
                  rows="10"
                  cols="50"
                  th:text="${post.content}"></textarea>
    </div>
    <div>
        <label for="status">상태</label>

        <select id="status" name="status">
            <option value="DRAFT"
                    th:selected="${post.status.name() == 'DRAFT'}">
                임시저장
            </option>

            <option value="PUBLISHED"
                    th:selected="${post.status.name() == 'PUBLISHED'}">
                발행
            </option>
        </select>
    </div>
    <div>
        <button type="submit">수정 완료</button>
    </div>
</form>

</body>
</html>
