<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 관리 - MyCMS</title>
</head>
<body>

<h1>게시글 관리( <span th:text="${#lists.size(posts)}"></span> 개)</h1>

<div>
    <a th:href="@{/admin/posts/new}">새 글 작성</a>
</div>

<div>
    <a th:href="@{/admin/posts}">전체</a>
    <a th:href="@{/admin/posts(status='DRAFT')}">초안</a>
    <a th:href="@{/admin/posts(status='PUBLISHED')}">공개</a>
</div>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>제목</th>
        <th>상태</th>
        <th>작성일</th>
        <th>관리</th>
    </tr>
    </thead>

    <tbody>
        <tr th:if="${ #lists.isEmpty(posts) }">
            <td colspan="5">게시글이 없습니다.</td>
        </tr>

        <tr th:each="post : ${posts}">
            <td th:text="${post.id}"></td>
            <td>
                <a th:href="@{/admin/posts/{id}(id=${post.id})}"
                   th:text="${post.title}">
                </a>
            </td>
            <td th:text="${post.status.name() == 'DRAFT'?'초안':'공개' }"></td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <a th:href="@{ /admin/posts/{id}/edit(id=${post.id}) }">수정</a>
                <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}"
                    method="post"
                    style="display: inline;">
                    <button type="submit">DELETE</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<div>
    <a th:href="@{/}">사이트 홈</a>
</div>

</body>
</html>
